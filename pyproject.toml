[project]
name = "jarvis-recipes"
version = "0.1.0"
description = "Jarvis Recipes FastAPI service"
authors = [
    {name = "alexberardi",email = "alex@jarvisautomation.io"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jarvis-config-client @ git+https://github.com/alexberardi/jarvis-config-client.git@fea99b556e2ac09a67101bd5e18af1dd4c923e4f",
    "jarvis-log-client @ git+https://github.com/alexberardi/jarvis-log-client.git@c2f8e82",
    "jarvis-settings-client @ git+https://github.com/alexberardi/jarvis-settings-client.git@402674d",
    "fastapi (>=0.123.10,<0.124.0)",
    "uvicorn[standard] (>=0.38.0,<0.39.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "pydantic (>=2.13.4,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "lxml (>=5.3.0,<6.0.0)",
    "Pillow (>=10.4.0,<11.0.0)",
    "pillow-heif (>=0.16.0,<0.17.0)",
    "boto3 (>=1.43.73,<2.0.0)",
    "rq (>=1.15.1,<2.0.0)",
    "redis (>=5.0.0,<6.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=8.3.0,<9.0.0)",
    "pytest-asyncio (==0.23.8)",
    "pytest-cov (>=5.0.0,<8.0.0)"
]

[tool.poetry]
packages = [{ include = "jarvis_recipes" }]

[tool.coverage.run]
source = ["jarvis_recipes"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
